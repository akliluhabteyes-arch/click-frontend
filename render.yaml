# Render Blueprint — ClickAddis public website (static site)
# Render → New → Blueprint → select this repository.
services:
  - type: web
    runtime: static
    name: click-frontend
    branch: main
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Address of the backend API (built into the site — redeploy after changing)
      - key: VITE_API_URL
        value: https://click-backend-xjio.onrender.com/api
    routes:
      # single-page app: every path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # hashed build files never change → cache for a year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
