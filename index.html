<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>
      ClickAddis IT Solution | ERP, Web & Mobile Development in Ethiopia
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="ClickAddis IT Solution is a modern software company in Addis Ababa, Ethiopia. We build ERP systems, mobile apps, and scalable web solutions for businesses."
    />

    <meta
      name="keywords"
      content="ClickAddis, IT Solution, Ethiopia software company, ERP Ethiopia, mobile app development Addis Ababa, web development Ethiopia, software company Addis Ababa"
    />

    <meta name="author" content="ClickAddis IT Solution" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.clickaddiserp.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/clickaddis-logo.png" />
    <link rel="apple-touch-icon" href="/clickaddis-logo.png" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ClickAddis IT Solution | ERP & Software Development in Ethiopia"
    />
    <meta
      property="og:description"
      content="We build modern ERP systems, mobile apps, and web solutions for businesses in Ethiopia and beyond."
    />
    <meta property="og:url" content="https://www.clickaddiserp.com" />
    <meta
      property="og:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/FSSvJvZrbXWLAk4yUWdVRVs3hqI3/social-images/social-1776680875369-image-removebg-preview_(8).webp"
    />
    <meta property="og:site_name" content="ClickAddis IT Solution" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ClickAddis IT Solution | ERP & Software Development"
    />
    <meta
      name="twitter:description"
      content="Modern ERP, mobile and web development company based in Addis Ababa, Ethiopia."
    />
    <meta
      name="twitter:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/FSSvJvZrbXWLAk4yUWdVRVs3hqI3/social-images/social-1776680875369-image-removebg-preview_(8).webp"
    />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://storage.googleapis.com" />

    <!-- Structured Data (Google SEO Boost) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ClickAddis IT Solution",
        "url": "https://www.clickaddiserp.com",
        "logo": "https://www.clickaddiserp.com/clickaddis-logo.png",
        "description": "Software company in Addis Ababa specializing in ERP systems, mobile apps, and web development.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Addis Ababa",
          "addressCountry": "Ethiopia"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
